apiVersion: v1
kind: ConfigMap
metadata:
  name: drive-config
  namespace: drive-mini
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "drive_db"
  DB_USER: "drive_user"
  MINIO_ENDPOINT: "minio-service"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_FILES_BUCKET: "drive-files"
  MINIO_THUMBNAILS_BUCKET: "drive-thumbnails"
  MINIO_PUBLIC_URL: "http://localhost:9000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_QUEUE_NAME: "thumbnail_jobs"
  THUMBNAIL_WIDTH: "256"
  THUMBNAIL_HEIGHT: "256"
  DEFAULT_QUOTA_BYTES: "1073741824" # 1 GB

