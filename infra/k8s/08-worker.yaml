apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: drive-mini
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: drive-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: drive-config
            - secretRef:
                name: drive-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

