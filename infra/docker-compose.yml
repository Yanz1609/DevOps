services:
  # 1. PostgreSQL - Metadata storage
  postgres:
    image: postgres:16-alpine
    container_name: drive_postgres
    restart: always
    environment:
      POSTGRES_USER: drive_user
      POSTGRES_PASSWORD: drive_secret_password
      POSTGRES_DB: drive_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../api/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive_user -d drive_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO - Object Storage (Build từ official binary)
  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
    image: drive-minio:local
    container_name: drive_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. MinIO Helper - Create Buckets automatically
  minio-init:
    image: drive-minio:local
    container_name: drive_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set localminio http://minio:9000 minioadmin minioadmin123;
      mc mb localminio/drive-files --ignore-existing;
      mc mb localminio/drive-thumbnails --ignore-existing;
      mc anonymous set download localminio/drive-thumbnails;
      echo 'MinIO buckets and policies configured successfully.';
      exit 0;
      "

  # 4. Redis - Job Queue
  redis:
    image: redis:7-alpine
    container_name: drive_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. Backend API Service
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: drive_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: drive_user
      DB_PASSWORD: drive_secret_password
      DB_NAME: drive_db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_FILES_BUCKET: drive-files
      MINIO_THUMBNAILS_BUCKET: drive-thumbnails
      MINIO_PUBLIC_URL: http://localhost:9000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_QUEUE_NAME: thumbnail_jobs
      JWT_SECRET: super_secret_jwt_key_drive_mini_devops_2026
      JWT_EXPIRES_IN: 7d
      DEFAULT_QUOTA_BYTES: 1073741824
    ports:
      - "5000:5000"

  # 6. Thumbnail Worker Service
  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: drive_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: drive_user
      DB_PASSWORD: drive_secret_password
      DB_NAME: drive_db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_FILES_BUCKET: drive-files
      MINIO_THUMBNAILS_BUCKET: drive-thumbnails
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_QUEUE_NAME: thumbnail_jobs
      THUMBNAIL_WIDTH: 256
      THUMBNAIL_HEIGHT: 256

  # 7. Frontend UI (React + Vite SPA)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: drive_frontend
    restart: always
    depends_on:
      - api
    ports:
      - "3000:80"

  # 8. Ingress Reverse Proxy (Giới hạn kích thước upload 100M)
  ingress:
    image: nginx:alpine
    container_name: drive_ingress
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api

volumes:
  postgres_data:
  minio_data:
  redis_data:
